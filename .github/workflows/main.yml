name: Scrape FanCode Live & 5-Days Schedule

on:
  schedule:
    # Har 30 minute mein auto-run hoga (live events update rakhne ke liye)
    - cron: '*/30 * * * *'
  # GitHub Actions tab se manually run karne ke liye
  workflow_dispatch:

jobs:
  scrape-fancode:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Install Playwright Chromium Browser
        run: |
          playwright install chromium --with-deps

      - name: Run FanCode Live & Schedule Scraper
        run: |
          python fancode_all_live_5days.py

      - name: Commit and Push JSON Output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add fancode_matches.json
          
          if git diff --staged --quiet; then
            echo "No new updates found. Skipping commit."
          else
            git commit -m "chore: update fancode live & 5-days schedule [skip ci]"
            git push
          fi
          
